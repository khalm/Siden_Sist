<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siden Sist</title>
  
  <!-- Manifest for Android/Chrome og iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Siden Sist">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f172a;
      --emerald-bg: #ecfdf5;
      --emerald-text: #065f46;
      --emerald-border: #a7f3d0;
      --emerald-hover: #d1fae5;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 18px 60px;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.45s ease;
    }
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo-box {
      width: 76px;
      height: 76px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      animation: splashPulse 2s infinite ease-in-out;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .splash-logo-box svg {
      width: 38px;
      height: 38px;
      stroke: #38bdf8;
    }
    .splash-title {
      color: #f8fafc;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .splash-sub {
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 500;
      margin-top: 4px;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Legg til oppgave */
    .add-box {
      display: flex;
      gap: 10px;
      background: #ffffff;
      padding: 6px;
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .add-box:focus-within {
      border-color: #94a3b8;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
    }
    input[type="text"].main-input {
      flex: 1;
      padding: 12px 14px;
      border: none;
      background: transparent;
      font-size: 0.98rem;
      color: var(--text-main);
      outline: none;
    }
    input[type="text"].main-input::placeholder {
      color: #94a3b8;
    }
    .btn-add {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0 22px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-add:active {
      transform: scale(0.97);
    }

    /* Oppgavekort */
    .list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }
    .delete-card-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: color 0.15s, background-color 0.15s;
    }
    .delete-card-btn:hover {
      color: #ef4444;
      background-color: #fef2f2;
    }

    /* Hovedvisning av tid */
    .time-stat {
      background: #f1f5f9;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }
    .time-since {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1e293b;
    }
    .exact-date {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Knapper */
    .actions {
      display: flex;
      gap: 8px;
    }
    button.action-btn {
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      background: #ffffff;
      color: #334155;
      transition: all 0.15s ease;
    }
    button.action-btn:active {
      transform: scale(0.98);
    }

    button.btn-today {
      flex: 1.2;
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      color: var(--emerald-text);
      font-weight: 700;
    }
    button.btn-today:hover {
      background: var(--emerald-hover);
    }

    button.btn-secondary {
      flex: 1;
      background: #f8fafc;
      color: var(--text-muted);
      border-color: var(--border);
    }
    button.btn-secondary:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }

    /* Datovelger */
    .datepicker-box {
      margin-top: 12px;
      padding: 12px;
      background: #f8fafc;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .datepicker-box input[type="date"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
    }
    .datepicker-box button {
      padding: 8px 14px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Historikk */
    details.history-details {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }
    details.history-details summary {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    details.history-details summary::-webkit-details-marker { display: none; }
    details.history-details summary span.icon {
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }
    details[open] summary span.icon {
      transform: rotate(180deg);
    }

    .history-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      border: 1px solid #edf2f7;
    }
    .history-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      background: #e2e8f0;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .history-note-input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 4px 6px;
      font-size: 0.85rem;
      color: #334155;
      outline: none;
      border-radius: 4px;
      transition: background-color 0.15s;
    }
    .history-note-input:focus {
      background: #ffffff;
      box-shadow: 0 0 0 1.5px #cbd5e1;
    }
    .history-note-input::placeholder {
      color: #cbd5e1;
    }
    .btn-delete-entry {
      background: none;
      border: none;
      color: #cbd5e1;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: color 0.15s, background-color 0.15s;
    }
    .btn-delete-entry:hover {
      color: #ef4444;
      background-color: #fee2e2;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <div class="splash-title">Siden Sist</div>
    <div class="splash-sub">Oversikt i eget tempo</div>
  </div>

  <!-- Hovedinnhold -->
  <div class="add-box">
    <input type="text" id="taskInput" class="main-input" placeholder="Hva vil du følge med på?" onkeydown="if(event.key==='Enter') addTask()">
    <button class="btn-add" onclick="addTask()">Legg til</button>
  </div>

  <div class="list" id="taskList"></div>

  <script>
    // Fjern Splash Screen etter 1200 ms (1,2 sekunder)
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('hidden');
      }, 1200);
    });

    const defaultData = [
      {
        id: 1,
        title: 'Klippet plenen',
        history: [
          { entryId: 101, date: getPastDateString(8), note: 'Litt fuktig i gresset' },
          { entryId: 102, date: getPastDateString(22), note: 'Første klipp for sesongen' }
        ]
      },
      {
        id: 2,
        title: 'Klippet håret',
        history: [
          { entryId: 201, date: getPastDateString(42), note: 'Kort på sidene' }
        ]
      },
      {
        id: 3,
        title: 'Vasket stekeovn',
        history: [
          { entryId: 301, date: getPastDateString(410), note: 'Grundig vask med spray' }
        ]
      }
    ];

    let tasks = JSON.parse(localStorage.getItem('siden_sist_oppgaver_v2')) || defaultData;

    function saveToStorage() {
      localStorage.setItem('siden_sist_oppgaver_v2', JSON.stringify(tasks));
      render();
    }

    function formatTimeSince(dateStr) {
      if (!dateStr) return 'Aldri logget';
      const parts = dateStr.split('-');
      const past = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      past.setHours(0,0,0,0);
      now.setHours(0,0,0,0);

      const diffMs = now - past;
      const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (totalDays === 0) return 'I dag';
      if (totalDays === 1) return 'I går (1 dag)';
      if (totalDays < 0) return 'Frem i tid';
      if (totalDays < 365) return `${totalDays} dager siden`;

      const years = Math.floor(totalDays / 365);
      const remainingDays = totalDays % 365;
      const yearWord = years === 1 ? '1 år' : `${years} år`;

      if (remainingDays === 0) return `${yearWord} siden`;
      if (remainingDays === 1) return `${yearWord} og 1 dag siden`;
      return `${yearWord} og ${remainingDays} dager siden`;
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return 'Ingen dato';
      const [y, m, d] = dateStr.split('-');
      const months = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
      return `${parseInt(d)}. ${months[parseInt(m) - 1]} ${y}`;
    }

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getPastDateString(daysAgo) {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const val = input.value.trim();
      if (!val) return;

      tasks.unshift({
        id: Date.now(),
        title: val,
        history: [{ entryId: Date.now() + 1, date: getTodayString(), note: '' }]
      });
      input.value = '';
      saveToStorage();
    }

    function logDate(taskId, chosenDate) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      task.history.unshift({
        entryId: Date.now(),
        date: chosenDate,
        note: ''
      });
      task.history.sort((a, b) => new Date(b.date) - new Date(a.date));
      saveToStorage();
    }

    function updateNote(taskId, entryId, newNote) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      const entry = task.history.find(e => e.entryId === entryId);
      if (entry) {
        entry.note = newNote;
        localStorage.setItem('siden_sist_oppgaver_v2', JSON.stringify(tasks));
      }
    }

    function deleteEntry(taskId, entryId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      task.history = task.history.filter(e => e.entryId !== entryId);
      saveToStorage();
    }

    function deleteTask(id) {
      if (confirm('Fjerne denne oppgaven og all historikk?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveToStorage();
      }
    }

    function toggleDatePicker(id) {
      const el = document.getElementById(`picker-box-${id}`);
      el.style.display = (el.style.display === 'none' || !el.style.display) ? 'flex' : 'none';
    }

    function render() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';

      tasks.forEach(t => {
        const latestEntry = t.history.length > 0 ? t.history[0] : null;
        const latestDate = latestEntry ? latestEntry.date : null;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="title">${t.title}</span>
            <button class="delete-card-btn" onclick="deleteTask(${t.id})" title="Fjern oppgave">✕</button>
          </div>
          
          <div class="time-stat">
            <span class="time-since">${formatTimeSince(latestDate)}</span>
            <span class="exact-date">${formatDisplayDate(latestDate)}</span>
          </div>

          <div class="actions">
            <button class="action-btn btn-today" onclick="logDate(${t.id}, '${getTodayString()}')">Gjorde det i dag</button>
            <button class="action-btn btn-secondary" onclick="toggleDatePicker(${t.id})">Annen dato...</button>
          </div>

          <div id="picker-box-${t.id}" class="datepicker-box" style="display: none;">
            <input type="date" id="date-input-${t.id}" value="${getTodayString()}" max="${getTodayString()}">
            <button onclick="
              const val = document.getElementById('date-input-${t.id}').value;
              if (val) logDate(${t.id}, val);
            ">Lagre</button>
          </div>

          <details class="history-details" ${t.history.length === 0 ? 'style=\"display:none;\"' : ''}>
            <summary>
              <span>Historikk (${t.history.length})</span>
              <span class="icon">▼</span>
            </summary>
            <div class="history-list">
              ${t.history.map(entry => `
                <div class="history-item">
                  <span class="history-badge">${formatDisplayDate(entry.date)}</span>
                  <input type="text" class="history-note-input" placeholder="Skriv notat her..." value="${entry.note || ''}" 
                    onchange="updateNote(${t.id},${entry.entryId}, this.value)"
                    onblur="updateNote(${t.id},${entry.entryId}, this.value)">
                  <button class="btn-delete-entry" onclick="deleteEntry(${t.id},${entry.entryId})" title="Fjern denne datoen">✕</button>
                </div>
              `).join('')}
            </div>
          </details>
        `;
        container.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
